<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IMRS">
<title>IMRS Enterprise v2</title>
<style>
:root{
 --bg:#edf3f0;--panel:#fff;--panel2:#f7faf8;--ink:#0f201a;--muted:#687771;--line:#d8e3de;
 --accent:#137b5d;--accent2:#dff2ea;--dark:#07130f;--danger:#a33c3c;--warn:#9b6817;--blue:#2f648f;
 --shadow:0 10px 28px rgba(7,34,26,.06)
}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer;border-radius:11px;padding:10px 14px;font-weight:800;background:var(--accent);color:#fff}
input,select,textarea{width:100%;border:1px solid #cbd8d3;background:#fff;border-radius:10px;padding:11px 12px;color:var(--ink)}
textarea{resize:vertical}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:var(--dark);color:#fff}
.brand{display:flex;align-items:center;gap:10px}.brandmark{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:var(--accent);font-weight:900;font-size:22px}.brand strong,.brand small{display:block}.brand small{color:#9fb1aa;font-size:10px;text-transform:uppercase;letter-spacing:.11em}
.topactions{display:flex;gap:8px}.secondary{background:#20322d}.danger{background:var(--danger)}.ghost{background:#e4ece9;color:#263a34}.blue{background:var(--blue)}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1700px;margin:auto}
.sidebar{min-height:calc(100vh - 67px);position:sticky;top:67px;align-self:start;background:#fff;border-right:1px solid var(--line);padding:16px}
.nav{display:grid;gap:7px;margin-top:14px}.nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;color:var(--ink)}.nav button.active{background:var(--accent2);color:#0b634a}.nav small{color:var(--muted)}
.sideTitle{margin:20px 8px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:var(--muted)}
.companyMini{display:grid;gap:6px}.companyMini button{background:transparent;color:var(--ink);text-align:left;padding:10px}.companyMini button.active{background:var(--accent2);color:#0c634b}.companyMini strong,.companyMini small{display:block}.companyMini small{color:var(--muted);font-size:11px;margin-top:3px}
.content{padding:24px;min-width:0}.pageHead,.hero,.sectionHead,.footerActions{display:flex;justify-content:space-between;align-items:center;gap:18px}
.pageHead h1,.sectionHead h2{margin:4px 0}.pageHead p{color:var(--muted);max-width:600px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.15em;font-weight:900;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.stat,.panel,.hero{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
.stat{padding:17px}.stat span,.stat strong{display:block}.stat span{color:var(--muted);font-size:12px}.stat strong{font-size:29px;margin-top:8px}
.panel{padding:17px}.panel h3{margin-top:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{flex:1;min-width:210px}.toolbar select{width:auto}
.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-top:1px solid var(--line);white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}tbody tr{cursor:pointer}td small{display:block;color:var(--muted);margin-top:3px}
.pill{display:inline-block;background:#edf4f1;padding:6px 9px;border-radius:20px;font-size:11px}.score{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--accent2);font-weight:900}
.hero{padding:19px}.identity{flex:1}.companyName{font-size:30px;font-weight:900;border:0;outline:0;background:transparent}.meta{display:grid;grid-template-columns:.7fr 1.4fr 1fr 1fr;gap:8px;margin-top:12px}
.heroScore{min-width:155px;text-align:center;background:var(--dark);color:#fff;border-radius:14px;padding:13px}.heroScore span,.heroScore small{display:block;color:#a4b4ae}.heroScore strong{font-size:41px}
.tabs{display:flex;gap:7px;overflow:auto;padding:14px 0;position:sticky;top:67px;background:var(--bg);z-index:10}.tabs button{white-space:nowrap;background:#dfe8e4;color:#273b34}.tabs button.active{background:var(--accent);color:#fff}
.grid2,.grid3,.scoreGrid,.portfolioGrid,.icGrid{display:grid;gap:13px}.grid2{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.scoreGrid{grid-template-columns:repeat(2,1fr)}.portfolioGrid{grid-template-columns:1.2fr .8fr}.icGrid{grid-template-columns:repeat(2,1fr)}
.textCard textarea{min-height:180px}.scoreItem>div{display:flex;justify-content:space-between}.scoreItem input{margin-top:17px;accent-color:var(--accent)}
.stack{display:grid;gap:9px}.row{display:grid;gap:8px}.riskRow{grid-template-columns:1.2fr .6fr .6fr 1.4fr auto}.catRow{grid-template-columns:1.2fr .8fr .8fr 1.3fr auto}.reviewHead{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.review textarea{min-height:130px;margin-top:8px}
.icon{padding:8px 12px}.valuation label,.financialCard label{display:block;color:var(--muted);font-size:12px;margin-top:9px}.valuation label input,.financialCard label input{margin-top:5px}.implied{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.implied span,.implied strong{display:block}.implied strong{font-size:26px}.weighted{text-align:center;margin-top:13px}.weighted strong{display:block;font-size:39px}.weighted small{color:var(--muted)}
.kpiList{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px}.kpi span,.kpi strong{display:block}.kpi span{color:var(--muted);font-size:11px}.kpi strong{font-size:21px;margin-top:5px}
.watchCard,.docCard,.agentCard{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.watchCard small,.docCard small,.agentCard small{display:block;color:var(--muted);margin-top:3px}
.note{background:#fff8e8;border:1px solid #edd8a9;color:#6f4d11;padding:13px;border-radius:12px;margin-top:12px}.info{background:#eaf3fa;border:1px solid #c9dceb;color:#264e6c;padding:13px;border-radius:12px;margin-top:12px}
.aiPrompt{min-height:150px}.aiOutput{min-height:240px;background:#f8fbfa}.agentBadge{min-width:110px;text-align:center;padding:8px 10px;border-radius:18px;background:var(--accent2);color:#0c634b;font-size:11px;font-weight:900}
.finTable input{min-width:110px}.screenGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.screenResult{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.footerActions{margin:18px 0;padding-bottom:env(safe-area-inset-bottom);color:var(--muted);font-size:12px}
@media(max-width:1050px){.app{grid-template-columns:1fr}.sidebar{position:static;min-height:auto;border-right:0;border-bottom:1px solid var(--line)}.companyMini,.sideTitle{display:none}.nav{grid-template-columns:repeat(6,1fr)}.nav button{justify-content:center}.nav small{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid3,.portfolioGrid{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.brand small{display:none}.topactions .secondary{display:none}.content{padding:12px}.pageHead,.hero{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.stat strong{font-size:24px}.grid2,.scoreGrid,.icGrid{grid-template-columns:1fr}.heroScore{width:100%;display:flex;justify-content:center;align-items:center;gap:7px}.heroScore span,.heroScore small{display:inline}.heroScore strong{font-size:29px}.riskRow,.catRow,.reviewHead{grid-template-columns:1fr}.tabs{top:67px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{padding:9px 5px;font-size:12px}.toolbar select{width:100%}.screenGrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brandmark">I</div><div><strong>IMRS Enterprise v2</strong><small>Investment Research OS</small></div></div>
  <div class="topactions">
    <button class="secondary" onclick="exportData()">Export</button>
    <label class="secondary" style="padding:10px 14px;border-radius:11px;font-weight:800">Import<input id="importFile" type="file" accept=".json" style="display:none"></label>
    <button onclick="createCompany()">+ Company</button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <input id="sideSearch" placeholder="Search companies…" oninput="renderCompanyMini()">
    <div class="nav">
      <button id="nav-dashboard" onclick="showPage('dashboard')">Dashboard</button>
      <button id="nav-screener" onclick="showPage('screener')">Screener</button>
      <button id="nav-watchlist" onclick="showPage('watchlist')">Watchlist</button>
      <button id="nav-portfolio" onclick="showPage('portfolio')">Portfolio</button>
      <button id="nav-committee" onclick="showPage('committee')">AI Committee</button>
      <button id="nav-research" onclick="showResearchHome()">Research</button>
    </div>
    <div class="sideTitle">Companies</div>
    <div id="companyMini" class="companyMini"></div>
  </aside>

  <main class="content">
    <section id="page-dashboard"></section>
    <section id="page-screener" class="hidden"></section>
    <section id="page-watchlist" class="hidden"></section>
    <section id="page-portfolio" class="hidden"></section>
    <section id="page-committee" class="hidden"></section>
    <section id="page-research" class="hidden"></section>
  </main>
</div>

<script>
const KEY='imrs_enterprise_v2';
const scoreLabels={businessQuality:'Business quality',managementQuality:'Management quality',financialStrength:'Financial strength',growthRunway:'Growth runway',moat:'Competitive moat',governance:'Governance',valuation:'Valuation attractiveness',cashFlowQuality:'Cash-flow quality',industryTailwinds:'Industry tailwinds',riskReward:'Risk–reward'};
const tabs=[['overview','Overview'],['financials','Financials'],['scorecard','Scorecard'],['thesis','Thesis'],['risks','Risks'],['catalysts','Catalysts'],['documents','Documents'],['ai','AI Analysis'],['reviews','Quarterly Reviews'],['valuation','Valuation']];
let data={companies:[],portfolio:[]},selectedId='',activePage='dashboard',activeTab='overview';
const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function blankCompany(){return{id:uid(),name:'Untitled Company',ticker:'',sector:'',marketCap:'',status:'Watchlist',watchlisted:true,businessSummary:'',multibaggerCase:'',industryOpportunity:'',managementAssessment:'',bullThesis:'',bearThesis:'',keyAssumptions:'',thesisKillers:'',scores:Object.fromEntries(Object.keys(scoreLabels).map(k=>[k,5])),risks:[],catalysts:[],reviews:[],documents:[],aiPrompt:'',aiOutput:'',financials:{revenue:'',profit:'',eps:'',pe:'',roe:'',roce:'',debtEquity:'',promoterHolding:'',salesGrowth:'',profitGrowth:'',opm:'',cfo:'',currentPrice:''},valuation:{bear:{revenueGrowth:'',eps:'',pe:'',probability:'25'},base:{revenueGrowth:'',eps:'',pe:'',probability:'50'},bull:{revenueGrowth:'',eps:'',pe:'',probability:'25'}}}}
function demo(){let c=blankCompany();return Object.assign(c,{name:'Sample Small Cap Ltd',ticker:'SAMPLE',sector:'Industrial Manufacturing',marketCap:'1500',status:'Researching',businessSummary:'Replace this sample with products, customers, revenue model, geography and unit economics.',multibaggerCase:'A large addressable market, capacity expansion and disciplined reinvestment could create long-term compounding.',industryOpportunity:'Map industry size, structural growth, policy support, competition and market-share runway.',managementAssessment:'Assess promoter integrity, governance, execution and capital allocation.',bullThesis:'Build the strongest evidence-backed upside case.',bearThesis:'Build the strongest evidence-backed downside case.',keyAssumptions:'List every assumption that must hold.',thesisKillers:'Define evidence requiring exit or reassessment.',scores:{businessQuality:7,managementQuality:7,financialStrength:6,growthRunway:8,moat:6,governance:7,valuation:5,cashFlowQuality:6,industryTailwinds:8,riskReward:7},risks:[{title:'Customer concentration',probability:'Medium',impact:'High',mitigation:'Track top-customer share and diversification.'}],catalysts:[{title:'New capacity commissioning',date:'',status:'Expected',notes:'Monitor project timeline and utilization.'}],reviews:[{quarter:'Q1 FY27',verdict:'Unchanged',notes:'Record results, guidance, execution, valuation and thesis changes.'}],documents:[{name:'FY26 Annual Report',type:'Annual Report',status:'To Review'}],financials:{revenue:'850',profit:'72',eps:'18',pe:'24',roe:'17',roce:'21',debtEquity:'0.35',promoterHolding:'58',salesGrowth:'22',profitGrowth:'28',opm:'14',cfo:'68',currentPrice:'432'},valuation:{bear:{revenueGrowth:'10',eps:'20',pe:'15',probability:'25'},base:{revenueGrowth:'20',eps:'35',pe:'25',probability:'50'},bull:{revenueGrowth:'30',eps:'50',pe:'35',probability:'25'}}})}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));data=x&&x.companies?x:{companies:[demo()],portfolio:[]}}catch{data={companies:[demo()],portfolio:[]}}save();$('importFile').onchange=importData;showPage('dashboard');renderCompanyMini()}
function cur(){return data.companies.find(c=>c.id===selectedId)}
function score(c){let v=Object.values(c.scores).map(Number);return Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function attr(s){return esc(s).replace(/"/g,'&quot;')}
function opts(a,s){return a.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}
function showPage(page){activePage=page;['dashboard','screener','watchlist','portfolio','committee','research'].forEach(p=>{$('page-'+p).classList.toggle('hidden',p!==page);$('nav-'+p).classList.toggle('active',p===page)});if(page==='dashboard')renderDashboard();if(page==='screener')renderScreener();if(page==='watchlist')renderWatchlist();if(page==='portfolio')renderPortfolio();if(page==='committee')renderCommittee();if(page==='research')renderResearch()}
function renderCompanyMini(){let q=($('sideSearch').value||'').toLowerCase();$('companyMini').innerHTML=data.companies.filter(c=>(c.name+' '+c.ticker).toLowerCase().includes(q)).map(c=>`<button class="${selectedId===c.id?'active':''}" onclick="openCompany('${c.id}')"><strong>${esc(c.name)}</strong><small>${esc(c.ticker||'No ticker')} · ${score(c)}/100</small></button>`).join('')}
function createCompany(){let c=blankCompany();data.companies.unshift(c);selectedId=c.id;save();renderCompanyMini();openCompany(c.id)}
function showResearchHome(){selectedId=data.companies[0]?.id||'';showPage('research')}
function openCompany(id){selectedId=id;activeTab='overview';showPage('research');renderCompanyMini()}
function renderDashboard(){let cs=data.companies,avg=cs.length?Math.round(cs.reduce((s,c)=>s+score(c),0)/cs.length):0,owned=cs.filter(c=>c.status==='Owned').length,buy=cs.filter(c=>c.status==='Buy Candidate').length;let ranked=[...cs].sort((a,b)=>score(b)-score(a));$('page-dashboard').innerHTML=`<div class="pageHead"><div><span class="eyebrow">Research command centre</span><h1>Investment Dashboard</h1></div><p>Track opportunities, financial quality, conviction, portfolio exposure and thesis progress.</p></div><div class="stats"><div class="stat"><span>Companies tracked</span><strong>${cs.length}</strong></div><div class="stat"><span>Owned positions</span><strong>${owned}</strong></div><div class="stat"><span>Buy candidates</span><strong>${buy}</strong></div><div class="stat"><span>Average score</span><strong>${avg}/100</strong></div></div><div class="portfolioGrid"><section class="panel"><div class="sectionHead"><div><span class="eyebrow">Ranked universe</span><h2>Research pipeline</h2></div><button onclick="createCompany()">+ Company</button></div><div class="tableWrap"><table><thead><tr><th>Company</th><th>Sector</th><th>Status</th><th>ROCE</th><th>Growth</th><th>Score</th></tr></thead><tbody>${ranked.map(c=>`<tr onclick="openCompany('${c.id}')"><td><strong>${esc(c.name)}</strong><small>${esc(c.ticker)}</small></td><td>${esc(c.sector||'—')}</td><td><span class="pill">${esc(c.status)}</span></td><td>${c.financials.roce||'—'}${c.financials.roce?'%':''}</td><td>${c.financials.salesGrowth||'—'}${c.financials.salesGrowth?'%':''}</td><td><span class="score">${score(c)}</span></td></tr>`).join('')}</tbody></table></div></section><aside class="panel"><span class="eyebrow">Quick intelligence</span><h3>Research health</h3><div class="kpiList"><div class="kpi"><span>High-conviction ≥75</span><strong>${cs.filter(c=>score(c)>=75).length}</strong></div><div class="kpi"><span>ROCE ≥20%</span><strong>${cs.filter(c=>(+c.financials.roce||0)>=20).length}</strong></div><div class="kpi"><span>Sales growth ≥20%</span><strong>${cs.filter(c=>(+c.financials.salesGrowth||0)>=20).length}</strong></div><div class="kpi"><span>Low debt ≤0.5</span><strong>${cs.filter(c=>(+c.financials.debtEquity||99)<=.5).length}</strong></div></div><div class="note">Live NSE/BSE data and real AI calls require a cloud backend and API keys. This version prepares the workflow but does not fabricate live data.</div></aside></div>`}
function renderScreener(){let cs=data.companies;$('page-screener').innerHTML=`<div class="pageHead"><div><span class="eyebrow">Opportunity discovery</span><h1>Company Screener</h1></div><p>Filter the companies already entered into IMRS using quality, growth and valuation criteria.</p></div><section class="panel"><div class="screenGrid"><label>Minimum ROCE %<input id="s_roce" type="number" value="15"></label><label>Minimum sales growth %<input id="s_growth" type="number" value="15"></label><label>Maximum debt/equity<input id="s_debt" type="number" step=".1" value="1"></label><label>Maximum P/E<input id="s_pe" type="number" value="50"></label></div><button style="margin-top:12px" onclick="runScreen()">Run screen</button><div id="screenResults" class="stack" style="margin-top:14px"></div></section>`;runScreen()}
function runScreen(){let roce=+$('s_roce').value||0,g=+$('s_growth').value||0,d=+$('s_debt').value||999,pe=+$('s_pe').value||999;let list=data.companies.filter(c=>(+c.financials.roce||0)>=roce&&(+c.financials.salesGrowth||0)>=g&&(+c.financials.debtEquity||999)<=d&&(+c.financials.pe||999)<=pe);$('screenResults').innerHTML=list.map(c=>`<div class="screenResult" onclick="openCompany('${c.id}')"><div><strong>${esc(c.name)}</strong><small>ROCE ${c.financials.roce||'—'}% · Growth ${c.financials.salesGrowth||'—'}% · D/E ${c.financials.debtEquity||'—'} · P/E ${c.financials.pe||'—'}</small></div><span class="score">${score(c)}</span></div>`).join('')||'<p>No entered companies match the current criteria.</p>'}
function renderWatchlist(){let list=data.companies.filter(c=>c.watchlisted);$('page-watchlist').innerHTML=`<div class="pageHead"><div><span class="eyebrow">Opportunity radar</span><h1>Watchlist</h1></div><p>Maintain a focused list of companies requiring deeper work or a better entry valuation.</p></div><section class="panel"><div class="sectionHead"><h2>${list.length} companies</h2><button onclick="createCompany()">+ Company</button></div><div class="stack">${list.map(c=>`<div class="watchCard"><div onclick="openCompany('${c.id}')"><strong>${esc(c.name)}</strong><small>${esc(c.ticker)} · ${esc(c.sector||'No sector')} · ${c.status}</small></div><span class="score">${score(c)}</span></div>`).join('')||'<p>No companies in your watchlist.</p>'}</div></section>`}
function renderPortfolio(){let positions=data.portfolio,total=data.portfolio.reduce((s,p)=>s+(+p.quantity||0)*(+p.currentPrice||0),0),cost=data.portfolio.reduce((s,p)=>s+(+p.quantity||0)*(+p.averagePrice||0),0),pnl=total-cost;$('page-portfolio').innerHTML=`<div class="pageHead"><div><span class="eyebrow">Capital allocation</span><h1>Portfolio</h1></div><p>Track position size, cost, current value and concentration.</p></div><div class="stats"><div class="stat"><span>Invested value</span><strong>₹${Math.round(cost).toLocaleString('en-IN')}</strong></div><div class="stat"><span>Current value</span><strong>₹${Math.round(total).toLocaleString('en-IN')}</strong></div><div class="stat"><span>Unrealised P&amp;L</span><strong>₹${Math.round(pnl).toLocaleString('en-IN')}</strong></div><div class="stat"><span>Positions</span><strong>${positions.length}</strong></div></div><section class="panel"><div class="sectionHead"><h2>Positions</h2><button onclick="addPosition()">+ Position</button></div><div class="stack">${positions.map((p,i)=>`<div class="row riskRow"><input placeholder="Company / ticker" value="${attr(p.name)}" oninput="changePosition(${i},'name',this.value)"><input type="number" placeholder="Quantity" value="${attr(p.quantity)}" oninput="changePosition(${i},'quantity',this.value)"><input type="number" placeholder="Avg price ₹" value="${attr(p.averagePrice)}" oninput="changePosition(${i},'averagePrice',this.value)"><input type="number" placeholder="Current price ₹" value="${attr(p.currentPrice)}" oninput="changePosition(${i},'currentPrice',this.value)"><button class="icon danger" onclick="removePosition(${i})">×</button></div>`).join('')||'<p>No portfolio positions yet.</p>'}</div></section>`}
function addPosition(){data.portfolio.push({name:'',quantity:'',averagePrice:'',currentPrice:''});save();renderPortfolio()}function changePosition(i,k,v){data.portfolio[i][k]=v;save();renderPortfolio()}function removePosition(i){data.portfolio.splice(i,1);save();renderPortfolio()}
function renderCommittee(){let c=cur()||data.companies[0];if(!c){$('page-committee').innerHTML='<p>Create a company first.</p>';return}let agents=[['Business Analyst',c.scores.businessQuality,'Business model, customers, unit economics and scalability'],['Financial Analyst',c.scores.financialStrength,'Growth, margins, returns, balance sheet and cash conversion'],['Forensic Accountant',c.scores.governance,'Governance, accounting quality and red flags'],['Industry Expert',c.scores.industryTailwinds,'Industry structure, market size and competitive intensity'],['Risk Manager',c.scores.riskReward,'Downside, thesis killers and permanent-capital-loss risk'],['Chief Investment Officer',score(c)/10,'Integrated conviction and portfolio suitability']];$('page-committee').innerHTML=`<div class="pageHead"><div><span class="eyebrow">Multi-agent review</span><h1>Investment Committee</h1></div><p>This offline version converts your recorded scores into a committee dashboard. Real AI-generated opinions will require backend AI integration.</p></div><section class="panel"><div class="toolbar"><select onchange="selectedId=this.value;renderCommittee()">${data.companies.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="icGrid">${agents.map(a=>`<div class="agentCard"><div><strong>${a[0]}</strong><small>${a[2]}</small></div><span class="agentBadge">${Math.round(a[1]*10)}/100</span></div>`).join('')}</div><div class="info"><strong>Committee verdict:</strong> ${committeeVerdict(c)}</div></section>`}
function committeeVerdict(c){let s=score(c);if(s>=80)return'High-conviction candidate — proceed to valuation and forensic verification.';if(s>=70)return'Promising candidate — deepen research before position sizing.';if(s>=60)return'Watchlist quality — key weaknesses must improve.';return'Low-conviction — avoid until evidence changes.'}
function renderResearch(){let c=cur();if(!c){$('page-research').innerHTML=`<div class="pageHead"><div><span class="eyebrow">Research workspace</span><h1>No company selected</h1></div></div><button onclick="createCompany()">Create company</button>`;return}$('page-research').innerHTML=`<section class="hero"><div class="identity"><input class="companyName" value="${attr(c.name)}" oninput="setField('name',this.value)"><div class="meta"><input placeholder="Ticker" value="${attr(c.ticker)}" oninput="setField('ticker',this.value.toUpperCase())"><input placeholder="Sector" value="${attr(c.sector)}" oninput="setField('sector',this.value)"><input type="number" placeholder="Market cap ₹ cr" value="${attr(c.marketCap)}" oninput="setField('marketCap',this.value)"><select onchange="setField('status',this.value)">${opts(['Watchlist','Researching','Buy Candidate','Owned','Avoid','Exited'],c.status)}</select></div></div><div class="heroScore"><span>Conviction score</span><strong id="heroScore">${score(c)}</strong><small>/100</small></div></section><nav class="tabs">${tabs.map(([id,label])=>`<button class="${activeTab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`).join('')}</nav><div id="researchContent"></div><div class="footerActions"><span>Saved automatically on this device</span><div><button class="ghost" onclick="toggleWatchlist()">${c.watchlisted?'Remove from watchlist':'Add to watchlist'}</button> <button class="danger" onclick="deleteCompany()">Delete</button></div></div>`;renderResearchTab()}
function setField(k,v){cur()[k]=v;save();renderCompanyMini()}
function setTab(t){activeTab=t;renderResearch()}
function textCard(title,key,ph){return `<article class="panel textCard"><h3>${title}</h3><textarea placeholder="${ph}" oninput="setField('${key}',this.value)">${esc(cur()[key])}</textarea></article>`}
function renderResearchTab(){let c=cur(),out='';if(activeTab==='overview')out=`<div class="grid2">${textCard('Business summary','businessSummary','Products, customers, revenue model, geography and unit economics…')}${textCard('Multibagger case','multibaggerCase','Why could intrinsic value compound over 5–10 years?')}${textCard('Industry opportunity','industryOpportunity','TAM, structural tailwinds, competition and market-share runway…')}${textCard('Management assessment','managementAssessment','Integrity, execution, governance and capital allocation…')}</div>`;
if(activeTab==='financials')out=`<div class="grid3">${financialCard('Revenue ₹ crore','revenue',c.financials.revenue)}${financialCard('Net profit ₹ crore','profit',c.financials.profit)}${financialCard('EPS ₹','eps',c.financials.eps)}${financialCard('P/E','pe',c.financials.pe)}${financialCard('ROE %','roe',c.financials.roe)}${financialCard('ROCE %','roce',c.financials.roce)}${financialCard('Debt/Equity','debtEquity',c.financials.debtEquity)}${financialCard('Promoter holding %','promoterHolding',c.financials.promoterHolding)}${financialCard('Sales growth %','salesGrowth',c.financials.salesGrowth)}${financialCard('Profit growth %','profitGrowth',c.financials.profitGrowth)}${financialCard('Operating margin %','opm',c.financials.opm)}${financialCard('Operating cash flow ₹ crore','cfo',c.financials.cfo)}${financialCard('Current price ₹','currentPrice',c.financials.currentPrice)}</div><div class="info">Enter verified numbers from annual reports, exchange filings or trusted financial databases. This app does not invent live financial data.</div>`;
if(activeTab==='thesis')out=`<div class="grid2">${textCard('Bull thesis','bullThesis','Strongest evidence-backed upside case…')}${textCard('Bear thesis','bearThesis','Strongest evidence-backed downside case…')}${textCard('Key assumptions','keyAssumptions','What must be true?')}${textCard('Thesis killers','thesisKillers','What evidence requires exit or reassessment?')}</div>`;
if(activeTab==='scorecard')out=`<div class="scoreGrid">${Object.entries(scoreLabels).map(([k,l])=>`<article class="panel scoreItem"><div><strong>${l}</strong><span id="sv_${k}">${c.scores[k]}/10</span></div><input type="range" min="0" max="10" value="${c.scores[k]}" oninput="setScore('${k}',this.value)"></article>`).join('')}</div>`;
if(activeTab==='risks')out=`<section class="panel"><div class="sectionHead"><div><span class="eyebrow">Downside laboratory</span><h2>Risk register</h2></div><button onclick="addRisk()">+ Risk</button></div><div class="stack">${c.risks.map((r,i)=>`<div class="row riskRow"><input placeholder="Risk" value="${attr(r.title)}" oninput="changeRisk(${i},'title',this.value)"><select onchange="changeRisk(${i},'probability',this.value)">${opts(['Low','Medium','High'],r.probability)}</select><select onchange="changeRisk(${i},'impact',this.value)">${opts(['Low','Medium','High'],r.impact)}</select><input placeholder="Mitigation or trigger" value="${attr(r.mitigation)}" oninput="changeRisk(${i},'mitigation',this.value)"><button class="icon danger" onclick="removeRisk(${i})">×</button></div>`).join('')}</div></section>`;
if(activeTab==='catalysts')out=`<section class="panel"><div class="sectionHead"><div><span class="eyebrow">Re-rating triggers</span><h2>Catalyst tracker</h2></div><button onclick="addCatalyst()">+ Catalyst</button></div><div class="stack">${c.catalysts.map((r,i)=>`<div class="row catRow"><input placeholder="Catalyst" value="${attr(r.title)}" oninput="changeCat(${i},'title',this.value)"><input type="date" value="${attr(r.date)}" onchange="changeCat(${i},'date',this.value)"><select onchange="changeCat(${i},'status',this.value)">${opts(['Expected','In Progress','Delivered','Delayed','Failed'],r.status)}</select><input placeholder="Evidence and notes" value="${attr(r.notes)}" oninput="changeCat(${i},'notes',this.value)"><button class="icon danger" onclick="removeCat(${i})">×</button></div>`).join('')}</div></section>`;
if(activeTab==='documents')out=`<section class="panel"><div class="sectionHead"><div><span class="eyebrow">Source library</span><h2>Documents</h2></div><button onclick="addDocument()">+ Document</button></div><div class="stack">${c.documents.map((d,i)=>`<div class="docCard"><div><input placeholder="Document name" value="${attr(d.name)}" oninput="changeDocument(${i},'name',this.value)"><small>${esc(d.type)} · ${esc(d.status)}</small></div><div style="display:flex;gap:7px"><select onchange="changeDocument(${i},'type',this.value)">${opts(['Annual Report','Concall','Investor Presentation','Credit Rating','Exchange Filing','Other'],d.type)}</select><select onchange="changeDocument(${i},'status',this.value)">${opts(['To Review','Reviewed','Key Source'],d.status)}</select><button class="icon danger" onclick="removeDocument(${i})">×</button></div></div>`).join('')||'<p>No documents tracked yet.</p>'}</div><div class="info">File upload and automatic document reading require a cloud storage and AI backend. This section currently tracks your source library.</div></section>`;
if(activeTab==='ai')out=`<div class="grid2"><section class="panel"><span class="eyebrow">Research instruction</span><h3>AI analysis prompt</h3><textarea class="aiPrompt" placeholder="Example: Analyze the business quality, moat, management, financial risks and valuation…" oninput="setField('aiPrompt',this.value)">${esc(c.aiPrompt)}</textarea><button style="margin-top:10px" onclick="generateStructuredAnalysis()">Generate structured draft</button><div class="note">This button produces a structured draft from the information you entered. It is not a live LLM call.</div></section><section class="panel"><span class="eyebrow">Research output</span><h3>Analysis workspace</h3><textarea class="aiOutput" placeholder="Generated or pasted AI analysis…" oninput="setField('aiOutput',this.value)">${esc(c.aiOutput)}</textarea></section></div>`;
if(activeTab==='reviews')out=`<section><div class="sectionHead"><div><span class="eyebrow">Living investment journal</span><h2>Quarterly reviews</h2></div><button onclick="addReview()">+ Review</button></div><div class="stack">${c.reviews.map((r,i)=>`<article class="panel review"><div class="reviewHead"><input placeholder="Quarter, e.g. Q1 FY27" value="${attr(r.quarter)}" oninput="changeReview(${i},'quarter',this.value)"><select onchange="changeReview(${i},'verdict',this.value)">${opts(['Thesis Stronger','Unchanged','Thesis Weaker','Exit Triggered'],r.verdict)}</select><button class="icon danger" onclick="removeReview(${i})">×</button></div><textarea placeholder="Results, guidance, execution, valuation and required action…" oninput="changeReview(${i},'notes',this.value)">${esc(r.notes)}</textarea></article>`).join('')}</div></section>`;
if(activeTab==='valuation'){let cases=['bear','base','bull'],weighted=cases.reduce((s,k)=>{let v=c.valuation[k];return s+(+v.eps||0)*(+v.pe||0)*(+v.probability||0)/100},0);out=`<div class="grid3">${cases.map(k=>{let v=c.valuation[k],p=(+v.eps||0)*(+v.pe||0);return `<article class="panel valuation"><span class="eyebrow">${k} case</span>${valInput(k,'revenueGrowth','Revenue CAGR %',v.revenueGrowth)}${valInput(k,'eps','Future EPS ₹',v.eps)}${valInput(k,'pe','Exit P/E',v.pe)}${valInput(k,'probability','Probability %',v.probability)}<div class="implied"><span>Implied price</span><strong>₹${p.toLocaleString('en-IN')}</strong></div></article>`}).join('')}</div><article class="panel weighted"><span>Probability-weighted expected price</span><strong>₹${Math.round(weighted).toLocaleString('en-IN')}</strong><small>Scenario output, not a guaranteed target</small></article>`}$('researchContent').innerHTML=out}
function financialCard(label,key,value){return `<article class="panel financialCard"><label>${label}<input type="number" value="${attr(value)}" oninput="setFinancial('${key}',this.value)"></label></article>`}
function setFinancial(k,v){cur().financials[k]=v;save()}
function valInput(k,f,l,v){return `<label>${l}<input type="number" value="${attr(v)}" oninput="setVal('${k}','${f}',this.value)"></label>`}
function setVal(k,f,v){cur().valuation[k][f]=v;save();renderResearchTab()}
function setScore(k,v){cur().scores[k]=+v;$('sv_'+k).textContent=v+'/10';$('heroScore').textContent=score(cur());save();renderCompanyMini()}
function addRisk(){cur().risks.push({title:'',probability:'Medium',impact:'Medium',mitigation:''});save();renderResearchTab()}function changeRisk(i,k,v){cur().risks[i][k]=v;save()}function removeRisk(i){cur().risks.splice(i,1);save();renderResearchTab()}
function addCatalyst(){cur().catalysts.push({title:'',date:'',status:'Expected',notes:''});save();renderResearchTab()}function changeCat(i,k,v){cur().catalysts[i][k]=v;save()}function removeCat(i){cur().catalysts.splice(i,1);save();renderResearchTab()}
function addReview(){cur().reviews.unshift({quarter:'',verdict:'Unchanged',notes:''});save();renderResearchTab()}function changeReview(i,k,v){cur().reviews[i][k]=v;save()}function removeReview(i){cur().reviews.splice(i,1);save();renderResearchTab()}
function addDocument(){cur().documents.push({name:'',type:'Annual Report',status:'To Review'});save();renderResearchTab()}function changeDocument(i,k,v){cur().documents[i][k]=v;save();renderResearchTab()}function removeDocument(i){cur().documents.splice(i,1);save();renderResearchTab()}
function generateStructuredAnalysis(){let c=cur(),f=c.financials;let text=`IMRS Structured Draft — ${c.name}

Business:
${c.businessSummary||'Business summary not yet entered.'}

Growth case:
${c.multibaggerCase||'Multibagger case not yet entered.'}

Financial snapshot:
Revenue ₹${f.revenue||'—'} crore; Profit ₹${f.profit||'—'} crore; ROCE ${f.roce||'—'}%; ROE ${f.roe||'—'}%; Sales growth ${f.salesGrowth||'—'}%; Profit growth ${f.profitGrowth||'—'}%; Debt/Equity ${f.debtEquity||'—'}; P/E ${f.pe||'—'}.

Management:
${c.managementAssessment||'Management assessment not yet entered.'}

Bull thesis:
${c.bullThesis||'Not entered.'}

Bear thesis:
${c.bearThesis||'Not entered.'}

Key risks:
${c.risks.length?c.risks.map(r=>'- '+r.title+' ('+r.probability+' probability, '+r.impact+' impact)').join('\n'):'No risks entered.'}

Catalysts:
${c.catalysts.length?c.catalysts.map(x=>'- '+x.title+' — '+x.status).join('\n'):'No catalysts entered.'}

Committee verdict:
${committeeVerdict(c)}

Required next step:
Verify all financial figures, review primary documents, test the thesis killers, and complete valuation before making an investment decision.`;c.aiOutput=text;save();renderResearchTab()}
function toggleWatchlist(){cur().watchlisted=!cur().watchlisted;save();renderResearch()}
function deleteCompany(){let c=cur();if(c&&confirm('Delete '+c.name+'?')){data.companies=data.companies.filter(x=>x.id!==c.id);selectedId='';save();renderCompanyMini();showPage('dashboard')}}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='imrs-enterprise-v2-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.companies)throw 0;data=d;save();renderCompanyMini();showPage('dashboard')}catch{alert('Invalid IMRS backup')}};r.readAsText(f);e.target.value=''}
load();
</script>
</body>
</html>
